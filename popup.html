<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: #0f0f0f; }

    body {
      width: 260px;
      background: #0f0f0f;
      font-family: "YouTube Sans", Roboto, Arial, sans-serif;
      color: #fff;
      padding: 20px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .app-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #fff;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.active {
      background: #a8c7fa;
      box-shadow: 0 0 8px rgba(168, 199, 250, 0.75);
    }

    /* ── Primary button ── */
    #toggleBtn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    #toggleBtn:hover { opacity: 0.85; }

    #toggleBtn.start {
      background: #a8c7fa;
      color: #0d1117;
    }

    #toggleBtn.stop {
      background: rgba(255, 255, 255, 0.07);
      color: #666;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* ── Footer ── */
    .footer {
      margin-top: 14px;
      text-align: center;
    }

    #resetBtn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: #a8c7fa;
      color: #0d1117;
      transition: opacity 0.15s ease;
    }

    #resetBtn:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="header">
    <span class="app-name">YouTube Autopilot</span>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <button id="toggleBtn" class="start">Start DJ</button>

  <div class="footer">
    <button id="resetBtn">Reset taste profile</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

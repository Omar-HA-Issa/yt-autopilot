<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 220px;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px 16px;
    }
    .logo {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff0000;
    }
    #toggleBtn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    #toggleBtn:hover { opacity: 0.85; }
    #toggleBtn.start { background: #ff0000; color: #fff; }
    #toggleBtn.stop  { background: #272727; color: #aaa; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-dot"></div>
    YouTube Autopilot
  </div>
  <button id="toggleBtn" class="start">Start DJ</button>
  <script src="popup.js"></script>
</body>
</html>
